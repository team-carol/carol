# 컴포즈 프로젝트 이름을 체크아웃 디렉터리명(달라질 수 있음)이 아니라 고정값으로 박아둔다.
# carol-ops의 dockerctl.Client가 컨테이너를 com.docker.compose.project=carol 라벨로
# 스코프하므로, 이 이름이 바뀌면 carol-ops가 아무 컨테이너도 못 찾는다.
name: carol

services:
  postgres:
    image: postgres:16-alpine
    container_name: carol-postgres
    restart: unless-stopped
    mem_limit: ${POSTGRES_MEM_LIMIT:-3072m}
    memswap_limit: ${POSTGRES_MEM_LIMIT:-3072m}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-carol}
      POSTGRES_USER: ${POSTGRES_USER:-carol}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - carol-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  bot:
    image: ghcr.io/team-carol/carol:latest
    container_name: carol-bot
    restart: unless-stopped
    mem_limit: ${BOT_MEM_LIMIT:-4096m}
    memswap_limit: ${BOT_MEM_LIMIT:-4096m}
    volumes:
      - ./data:/app/data
      - ./config.json:/app/config.json:ro
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      # 메인 스레드 V8 힙 상한(MB). 여기에 RENDER_POOL_SIZE * 워커별 힙 상한(renderPool.ts,
      # 기본 256MB) + 오프힙 버퍼/오버헤드를 더한 값이 BOT_MEM_LIMIT를 넘지 않게 유지할 것.
      # 예산: 2048(메인) + 2*~320(워커) + ~500(버퍼) ≈ 3200 < 4096.
      NODE_OPTIONS: --max-old-space-size=${NODE_MAX_OLD_SPACE_MB:-2048}
      RENDER_POOL_SIZE: ${RENDER_POOL_SIZE:-2}
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3456/',r=>{process.exit(r.statusCode===404?0:1)}).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      # default: talk to postgres/cloudflared as before. carol-shared: reachable
      # by carol-ops (separate compose project) for GET /admin/status. Create
      # once on the host with `docker network create carol-shared` before the
      # first `docker compose up` that includes this network.
      - default
      - carol-shared

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: carol-tunnel
    restart: unless-stopped
    mem_limit: ${CLOUDFLARED_MEM_LIMIT:-64m}
    memswap_limit: ${CLOUDFLARED_MEM_LIMIT:-64m}
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CF_TUNNEL_TOKEN}
    depends_on:
      bot:
        condition: service_healthy

  # 도메인 이전용 임시 터널 — 구 도메인(config.json baseUrl과 다른 Host)으로 들어오는 트래픽을
  # 같은 bot 서비스로 계속 서빙. 이전 완료 후(DOMAIN_MIGRATION_CUTOFF 지나면) 이 서비스와
  # CF_TUNNEL_TOKEN_OLD를 .env에서 제거할 것.
  cloudflared-old:
    image: cloudflare/cloudflared:latest
    container_name: carol-tunnel-old
    restart: unless-stopped
    mem_limit: ${CLOUDFLARED_MEM_LIMIT:-64m}
    memswap_limit: ${CLOUDFLARED_MEM_LIMIT:-64m}
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CF_TUNNEL_TOKEN_OLD}
    depends_on:
      bot:
        condition: service_healthy

volumes:
  carol-postgres:

networks:
  carol-shared:
    external: true
